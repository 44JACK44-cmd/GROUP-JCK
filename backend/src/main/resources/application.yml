spring:
  application:
    name: gas-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    # Solo desarrollo local. En producción usar variables de entorno.
    password: ${DB_PASSWORD:Gas2026!}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-esta-clave-secreta-en-produccion-32bytes!}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
